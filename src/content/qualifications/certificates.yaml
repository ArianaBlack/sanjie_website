# ═══════════════════════════════════════════════════════════════
#  资质与荣誉清单
# ═══════════════════════════════════════════════════════════════
#
#  使用说明：
#    1. 在下面按格式追加条目，顶层键（如 business-license）是内部标识，
#       随便起英文名即可，不会显示在网站上
#    2. image 指向相对于本文件的图片路径，图片放在同目录的 images/ 子文件夹里
#    3. publicOk 为 false 的条目不会在网站上展示，仅内部留档
#    4. category 只能填以下六个之一：
#         主体资质 / 行业资质 / 体系认证 / 人员证书 / 荣誉奖项 / 协会会员
#    5. weight 是排序权重，数字越小越靠前
#
#  ⚠️ 合规提醒：**没有的资质不要写**。虚假资质宣传违反《广告法》。
#  ⚠️ 人员证书只需提供人数统计，不要上传个人证书扫描件（涉及个人隐私）。
#
#  ── 本文件的条目来源 ──────────────────────────────────────────
#  全部内容逐字核对自公司提供的《建筑业企业资质证书》扫描件，未作任何推测。
#  该证书上「资质类别及等级」一栏只列了「消防设施工程专业承包壹级」一项。
#
#  ⚠️ 待公司确认后才可添加的条目（目前一律不写入）：
#    - 安全生产许可证：《供应商信息表》上登记的编号为（湘）JZ 安许证字〔2017〕001040，
#      有效期 2023.07.14–2026.07.13，**已于 2026 年 7 月 13 日到期**。
#      拿到续期后的新证再添加；过期证书挂出去比不挂更糟。
#    - 营业执照：尚未拿到扫描件。
#    - 消防设施维护保养检测：公司已于 2026-09-28 提供「社会消防技术服务信息系统」
#      的公示截图，证实服务类型为「消防设施维护保养检测」，条目已加入（见下）。
#      ⚠️ 但注意措辞：2019 年起该事项已由行政许可改为**从业条件备案制**，
#         系统里记录的字段名是「服务类型」，不存在「消防设施维护保养检测资质」这张证书。
#         因此下面写「从业条件备案」，不写「资质」。
#    - ISO 体系认证 / 荣誉奖项 / 专利：公司在《供应商信息表》「供应商提供资料」
#      一栏中未勾选这些项，因此按「没有」处理。
#
#  ═══════════════════════════════════════════════════════════════

# 建筑业企业资质证书 —— 消防设施工程专业承包壹级
# 对应扫描件原件：web_material/02_资质与荣誉/三杰资质文件_扫描版(1).pdf
construction-license:
  title: 建筑业企业资质证书 · 消防设施工程专业承包壹级
  issuer: 湖南省住房和城乡建设厅
  number: D243069305
  # ⚠️ 必须加引号：不加的话 YAML 会把它解析成日期对象，
  #    而 schema 里 validUntil 是字符串，构建会直接报错。
  validUntil: "2029-08-16"
  category: 行业资质
  image: ./images/construction-license.jpg
  publicOk: true
  weight: 20

# 消防设施维护保养检测 —— 从业条件备案公示
# 截图来源：社会消防技术服务信息系统（应急管理部消防救援局主办）
# 截图日期：2026-09-28，由公司提供
#
# ⚠️ 为什么标题写「从业条件备案」而不是「资质」：
#    2019 年起，消防设施维护保养检测已由行政许可改为**从业条件备案制**，
#    不存在「消防设施维护保养检测资质证书」这个东西。系统里该字段叫「服务类型」。
#    写「持有维保检测资质」既不符合事实，也违反公司自己的合规要求（不得虚构资质）。
#
# ⚠️ 截图内含人员姓名（注册消防工程师 2 名、消防设施操作员 6 名）。
#    这是该系统的**公开公示信息**，法规要求消防技术服务机构接受社会监督，
#    任何人都可查询核验，因此按原样展示。证书编号在系统中本身即为脱敏显示（xxxxx）。
#
# ⚠️ 注册有效期会过期，届期请更新截图：
#      傅志杭  2023-10-26 至 2026-10-26
#      谭刚来  2023-12-15 至 2026-12-15
#    两人均在 2026 年内到期，需完成延续注册后重新截图替换。
maintenance-filing:
  title: 消防设施维护保养检测 · 从业条件备案
  issuer: 社会消防技术服务信息系统
  # 该系统不发放证书编号，此处填公示主体标识（统一社会信用代码）
  number: "91430111MA4LD12G05"
  validUntil: 长期有效（注册消防工程师注册有效期至 2026 年 12 月）
  category: 行业资质
  image: ./images/maintenance-filing.png
  publicOk: true
  weight: 25

